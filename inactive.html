<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ALR Digital Business Card</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet"
          href="style.css">

</head>

<body>

<div class="business-container">

    <div class="left-side">

        <div class="logo-section">

            <img src="logo.png"
                 alt="ALR Logo">

        </div>

        <div class="group-title">
            GROUP OF COMPANIES
        </div>

        <div class="group-companies">
            <span>KESAS | LITRAK | SPRINT | SMART</span>
        </div>

    </div>

    <div class="right-side">

        <div class="employee-panel">

            <h1>Profile Unavailable</h1>

            <h3>
                This employee profile is currently unavailable.
            </h3>

            <p>
                For corporate enquuiries, please visit:
            </p>

            <a href="https://www.amanatlr.com"
               target="_blank">
                www.amanatlr.com

            </a>

        </div>

    </div>

</div>

</body>

</html>
