<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALR Digital Business Card</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <style>
        #officeMapLink:hover {
         text-decoration: none;
         cursor: pointer;
         opacity: 0.85;
        }
    </style>
</head>

<body>

<div class="business-container">

    <!-- LEFT SIDE -->
    <div class="left-side" style="min-width: 250px;">

        <div class="logo-section">
            <img src="logo.png" alt="ALR Logo">
        </div>

        <div class="group-title">
            GROUP OF COMPANIES
        </div>

        <div class="group-companies">
            <span> KESAS | LITRAK | SPRINT | SMART </span>
        </div>

        <div class="qr-section">
                <img id="qrImage" src="">
        </div>
    
    </div>
    
    <!-- RIGHT SIDE -->
    <div class="right-side">

        <div class="employee-panel">

            <h1 id="preferredName"></h1>

            <h2 id="fullName"></h2>

            <h3 id="jobTitle"></h3>

            <h4 id="department"></h4>
         
            <div class="contact-list">

                <div class="contact-item">
                    <div class="icon">☎</div>

                    <div class="value">    
                        <a id="mobileLink">
                            Mobile Number
                        </a>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="icon">🏢</div>

                    <div class="value">    
                        <a id="officeLink">
                            Office Number  
                        </a>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="icon">✉</div>

                    <div class="value">
                        <a id="emailLink">
                            Email
                        </a>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="icon">🌐</div>

                    <div class="value">
                        <a href="https://www.amanatlr.com"
                            target="_blank">
                                www.amanatlr.com
                        </a>        
                    </div>
                </div>

                <div class="contact-item">
                    <div class="icon">💾</div>

                    <div class="value">
                        <a id="vcfLink" download>
                            Save Contact
                        </a>
                    </div>
                </div>

                <div class="address-section" style="margin-bottom: 15px;">
                    <a id="officeMapLink" target="_blank">
                        <span id="address"></span>            
                    </a>     
                </div>

            </div>

        </div>

    </div>

</div>

<script>

const urlParams =
    new URLSearchParams(window.location.search);

const publicID =
    urlParams.get("id");

fetch(
    "./json/" +
    publicID +
    ".json"
)

    .then(response => {

        if (!response.ok) {
            throw new Error("JSON file not found");
        }

        return response.json();

    })

    .then(data => {

        //Invalid
        if(String(data.status).toLowerCase() === "false") {
        window.location.href =
            "./invalid.html";
        return;
        }

        console.log(data);

        // QR
        document.getElementById("qrImage").src =
            "./qr/" + publicID + ".png";

        // Basic Details
        if(String(data.isExecutive).toLowerCase() === "true") {

            document.getElementById("preferredName")
                .innerText = data.preferredName || "";

            document.getElementById("fullName")
                .innerText = data.fullName || "";

            document.getElementById("jobTitle")
                .innerText = data.jobTitle || "";

            document.getElementById("department")
                .innerText = "";

            document.getElementById("department")
                .style.display = "none";

        }
        else {

            document.getElementById("preferredName")
                .innerText = data.fullName || "";

            document.getElementById("fullName")
                .innerText = "";

            document.getElementById("jobTitle")
                .innerText = data.jobTitle || "";

            document.getElementById("department")
                .innerText = data.department || "";

            document.getElementById("department")
                .style.display = "block";
        }

        // Mobile
        document.getElementById("mobileLink")
            .href = `tel:${data.mobileNo}`;

        document.getElementById("mobileLink")
            .innerText = data.mobileNo || "";

        // Office
        document.getElementById("officeLink")
            .href = `tel:${data.officeNo}`;

        document.getElementById("officeLink")
            .innerText = data.officeNo || "";

        // Email
        document.getElementById("emailLink")
            .href = `mailto:${data.email}`;

        document.getElementById("emailLink")
            .innerText = data.email || "";

        // Address
        let formattedAddress =
            (data.officeAddress || "")
                .replace(/\n/g, "<br>");

        document.getElementById("address")
            .innerHTML = formattedAddress;

        // Maps Link
        if (data.mapURL) {

            document.getElementById("officeMapLink")
                .href = data.mapURL;
        }
        else {

            document.getElementById("officeMapLink")
                .removeAttribute("href");

        }

        // VCF
        document.getElementById("vcfLink")
            .href =
                    "./vcf/" +
                    publicID +
                    ".vcf";

    })

    .catch(error => {

    console.error(error);
    window.location.href =
        "./invalid.html";

    });

</script>


</body>
</html>
